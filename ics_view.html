<!-- jsPDF: สร้างไฟล์ PDF จากภาพใบตอนลูกค้ากดปุ่มดาวน์โหลด (async กันเน็ตช้าไปบล็อกหน้า — โหลดไม่ได้ก็ยังดู/พิมพ์ได้) -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --navy:#0f2744; }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;font-family:'IBM Plex Sans Thai',sans-serif;background:#e5e7eb;}
  .topbar{background:var(--navy);color:#fff;padding:12px 14px;}
  .topbar .title{font-size:14px;font-weight:700;}
  .topbar .sub{font-size:11px;color:#9fc4ec;margin-top:2px;}
  .btns{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.primary{background:#2e75b6;border-color:#2e75b6;}
  .hintbar{font-size:11px;color:#64748b;text-align:center;padding:8px 10px 0;}
  .msgbar{margin:8px 8px 0;padding:8px 10px;border-radius:8px;background:#fef9c3;border:1px solid #eab308;color:#713f12;font-size:12px;text-align:center;}
  .stage{max-width:960px;margin:10px auto 24px;padding:0 8px;}
  /* โหมดภาพ: ภาพถ่ายใบที่ออกจริง (ไม่เปลี่ยนย้อนหลัง) เต็มความกว้างจอ ถ่างนิ้วขยายได้ */
  .snap-wrap{max-width:794px;margin:0 auto;}
  .snap-img{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);}
  /* โหมดสำรอง (ใบเก่าที่ยังไม่มีภาพ): กระดาษ A4 ขนาดจริงย่อพอดีจอด้วย JS */
  .stage-inner{width:100%;overflow:hidden;position:relative;}
  .sheet{width:210mm;height:297mm;padding:10mm;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);transform-origin:0 0;}
  .ics-page{width:186mm;height:265mm;overflow:hidden;}
  .state-box{text-align:center;padding:60px 20px;color:#64748b;font-size:14px;}
  .state-box.err{color:#dc2626;}
  /* หน้ากรอกรหัสผ่าน (ใบที่ลูกค้าป้องกันไว้) */
  .lockbox{max-width:380px;margin:26px auto;background:#fff;border-radius:16px;padding:22px 18px;box-shadow:0 2px 14px rgba(0,0,0,.14);text-align:center;}
  .lock-ico{font-size:34px;line-height:1;}
  .lock-title{font-size:16px;font-weight:700;margin:8px 0 4px;color:#0f2744;}
  .lock-sub{font-size:12.5px;color:#64748b;margin-bottom:14px;line-height:1.5;}
  .lock-row{display:flex;gap:6px;}
  .lock-row input{flex:1;min-width:0;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-family:inherit;}
  .lock-eye{width:46px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;font-size:17px;cursor:pointer;}
  .lock-rem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#475569;margin:12px 2px 0;text-align:left;}
  .lock-btn{width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:#2e75b6;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  .lock-btn:disabled{opacity:.6;cursor:wait;}
  .lock-err{min-height:18px;margin-top:10px;font-size:13px;color:#dc2626;font-weight:600;}
  .lock-forget{margin-top:6px;background:none;border:none;color:#64748b;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;}
  @media print {
    .lockbox{display:none !important;}
    @page{size:A4 portrait;margin:0;}
    html,body{background:#fff;margin:0;}
    .topbar,.hintbar,.msgbar,.state-box{display:none !important;}
    .stage{max-width:none;margin:0;padding:0;}
    .snap-wrap{max-width:none !important;}
    .snap-img{box-shadow:none !important;width:auto !important;max-width:none !important;height:296mm !important;margin:0 auto;}
    .stage-inner{height:auto !important;overflow:visible;}
    .sheet{transform:none !important;margin:0 !important;box-shadow:none !important;height:296mm !important;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>

<div class="topbar">
  <div class="title">🔍 ใบตรวจสอบคุณภาพ (Inspection Check Sheet)</div>
  <div id="navRow" style="display:none;gap:8px;margin-bottom:8px;">
    <button class="btn" id="navBack" onclick="history.back()" style="display:none;">← กลับ</button>
    <a class="btn" id="navHome" href="index.html" style="display:none;text-decoration:none;">🏠 หน้าแรก</a>
  </div>
  <div class="sub" id="topSub">APK Plating Service Co.,Ltd. — เปิดดูได้สาธารณะ ไม่ต้องเข้าสู่ระบบ</div>
  <div class="btns" id="btnRow" style="display:none;">
    <button class="btn primary" id="pdfBtn" onclick="downloadPdf()" style="display:none;">⬇️ ดาวน์โหลด PDF</button>
    <button class="btn" id="printBtn" onclick="window.print()" style="display:none;">🖨️ พิมพ์</button>
  </div>
</div>
<div class="msgbar" id="msgBar" style="display:none;"></div>
<div class="hintbar" id="hintBar" style="display:none;">ใช้สองนิ้วถ่างเพื่อขยายดูรายละเอียด</div>

<div class="stage" id="stage">
  <div id="stateArea" class="state-box">⏳ กำลังโหลดข้อมูล...</div>
  <div class="lockbox" id="lockBox" style="display:none;">
    <div class="lock-ico">🔒</div>
    <div class="lock-title">ใบตรวจสอบนี้ป้องกันด้วยรหัสผ่าน</div>
    <div class="lock-sub">กรอกรหัสผ่านที่ APK Plating แจ้งให้ท่าน เพื่อเปิดดูใบตรวจสอบ</div>
    <div class="lock-row">
      <input type="password" id="pwInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน">
      <button type="button" class="lock-eye" id="pwEye" aria-label="แสดงหรือซ่อนรหัสผ่าน">👁</button>
    </div>
    <label class="lock-rem"><input type="checkbox" id="pwRemember"> จำรหัสไว้ในเครื่องนี้ (ใช้เฉพาะเครื่องส่วนตัวของท่าน)</label>
    <button type="button" class="lock-btn" id="pwBtn">เปิดดูใบตรวจสอบ</button>
    <div class="lock-err" id="pwErr" role="alert"></div>
    <button type="button" class="lock-forget" id="pwForget" style="display:none;">ลืมรหัสที่จำไว้ในเครื่องนี้</button>
  </div>
  <div class="snap-wrap" id="snapWrap" style="display:none;"><img class="snap-img" id="snapImg" alt="ใบตรวจสอบคุณภาพ (Inspection Check Sheet)"></div>
  <div class="stage-inner" id="stageInner">
    <div class="sheet" id="sheet" style="display:none;"><div class="ics-page" id="icsPage"></div></div>
  </div>
</div>

// แยกโปรเจกต์ Firebase ต่างหาก (apk-ics-public) จากระบบภายในทั้งหมด เพราะหน้านี้เปิดสาธารณะให้ลูกค้าสแกน QR
// เข้าถึงได้โดยไม่ต้อง login — ต้องตรงกับ ICS_FB_URL ใน tag_card.html เสมอ (คนละไฟล์แต่ต้องชี้ Firebase เดียวกัน)
var ICS_FB_URL = 'https://apk-ics-public-default-rtdb.asia-southeast1.firebasedatabase.app';
var ICS_RECORDS_URL = ICS_FB_URL + '/ics-records';
var ICS_SNAPS_URL = ICS_FB_URL + '/ics-snaps';
var currentSnap = null, currentRecord = null;

// ── ฟังก์ชันสร้างหน้าใบตรวจสอบ (ใช้เฉพาะโหมดสำรองของใบเก่าที่ไม่มีภาพ): คัดลอกจาก tag_card.html ทั้งดุ้น อย่าแก้ที่นี่ที่เดียว ──
function buildIcsPageHtml(ctx) {
  function row5(vals) { return vals.map(function(v){ return '<td style="border:1px solid #000;padding:3px;text-align:center;">'+esc(v)+'</td>'; }).join(''); }
  var sampleCellsVisual = row5(['OK','OK','OK','OK','OK']);
  var sampleCellsThick  = row5(ctx.samples.map(function(s){ return s===''||s==null ? '–' : s; }));

  function infoCell(label, value) {
    return '<td style="border:1px solid #000;padding:4px 6px;width:16%;font-weight:700;background:#f8fafc;">'+esc(label)+'</td>'+
           '<td style="border:1px solid #000;padding:4px 6px;width:17%;">'+esc(value)+'</td>';
  }

  // ความสูงมาตรฐานต่อแถวของส่วนหัว (Doc No./Issue Date + Cust/Name/P/No/P/Name) — ตั้งเท่ากันทุกแถวเป็นค่า
  // ต่ำสุด (height บน <tr> คือค่าต่ำสุด ไม่ใช่ค่าตายตัว) ถ้าเนื้อหายาวเกิน 1 บรรทัด (เช่น P/Name ยาวๆ) แถวนั้น
  // จะขยายสูงขึ้นอัตโนมัติเองโดยไม่กระทบแถวอื่น ──
  var HDR_ROW_H = 'height:7mm;';
  return '<div style="width:100%;height:100%;box-sizing:border-box;padding:6mm;font-family:\'IBM Plex Sans Thai\',sans-serif;font-size:11px;display:flex;flex-direction:column;">'+
    // หัวเอกสาร
    '<table style="width:100%;border-collapse:collapse;margin-bottom:0;flex-shrink:0;">'+
      '<tr style="'+HDR_ROW_H+'">'+
        '<td rowspan="2" style="border:1px solid #000;padding:6px;width:40%;vertical-align:middle;">'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            '<img src="data:image/png;base64,'+LOGO_B64+'" style="height:28px;">'+
            '<div style="font-size:16px;font-weight:800;">INSPECTION CHECK SHEET</div>'+
          '</div>'+
        '</td>'+
        '<td style="border:1px solid #000;padding:3px 6px;font-weight:700;background:#f8fafc;">Doc No.</td>'+
        '<td style="border:1px solid #000;padding:3px 6px;">'+esc(ctx.docNo)+'</td>'+
      '</tr>'+
      '<tr style="'+HDR_ROW_H+'">'+
        '<td style="border:1px solid #000;padding:3px 6px;font-weight:700;background:#f8fafc;">Issue Date</td>'+
        '<td style="border:1px solid #000;padding:3px 6px;">'+esc(ctx.issueDate)+'</td>'+
      '</tr>'+
    '</table>'+
    '<table style="width:100%;border-collapse:collapse;border-top:none;flex-shrink:0;">'+
      '<tr style="'+HDR_ROW_H+'">'+infoCell('Cust/Name', ctx.custName)+infoCell('Insp. Date', ctx.inspDate)+infoCell('Lot Size', ctx.lotSize+' '+(ctx.lotUnit||'pcs'))+'</tr>'+
      '<tr style="'+HDR_ROW_H+'">'+infoCell('P/No', ctx.partNo)+infoCell('Delivery Date', ctx.deliveryDate)+infoCell('Pro Lot No.', ctx.proLotNo)+'</tr>'+
      '<tr style="'+HDR_ROW_H+'">'+infoCell('P/Name', ctx.partName)+infoCell('Model', ctx.model||'-')+infoCell('Sampling Size', ctx.samplingSize+' pcs')+'</tr>'+
    '</table>'+
    // ── รูปชิ้นงาน — ยืดกินพื้นที่ที่เหลือทั้งหมดเสมอ (flex:1) ตรงกับต้นฉบับจริงที่ให้ช่องรูปใหญ่เต็มพื้นที่
    // ว่างด้านล่าง รับประกันว่าทุกครั้งที่พิมพ์จะเต็มกระดาษ A4 พอดี ไม่ว่าเนื้อหาส่วนอื่นจะสั้น/ยาวแค่ไหน ──
    '<div style="border:1px solid #000;border-top:none;padding:4px;text-align:center;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;">'+
      (ctx.photo ? '<img src="'+ctx.photo+'" style="max-width:100%;max-height:100%;object-fit:contain;">' : '<span style="font-size:10px;color:#666;">Picture</span>')+
    '</div>'+
    '<table style="width:100%;border-collapse:collapse;text-align:center;flex-shrink:0;margin-top:10px;">'+
      // หัวตาราง: พื้นเทาอ่อน+ตัวดำ ตรงกับแบบฟอร์มจริง — เดิมเป็นตัวขาวบนพื้นน้ำเงิน พอเบราว์เซอร์ไม่พิมพ์สีพื้นหลัง
      // (ค่าเริ่มต้น) ตัวหนังสือขาวจางหายบนกระดาษขาว และหน้าบนมือถือที่โชว์พื้นเต็มก็เลยดูต่างจากใบที่พิมพ์
      '<tr style="background:#e5e7eb;color:#000;height:7mm;">'+
        '<th style="border:1px solid #000;padding:4px;width:3%;">No.</th>'+
        '<th style="border:1px solid #000;padding:4px;width:15%;">Item Inspection</th>'+
        '<th style="border:1px solid #000;padding:4px;width:17%;">Standard</th>'+
        '<th style="border:1px solid #000;padding:4px;width:10%;">Measurement</th>'+
        '<th colspan="5" style="border:1px solid #000;padding:4px;">Sample No.</th>'+
        '<th style="border:1px solid #000;padding:4px;width:6%;">X̄</th>'+
        '<th style="border:1px solid #000;padding:4px;width:6%;">R</th>'+
        '<th style="border:1px solid #000;padding:4px;width:6%;">Result</th>'+
      '</tr>'+
      // ── แถว 1,2,4 สูงเท่ากันเป็นค่าเริ่มต้น (8mm) แถว 3 (Appearance) มีเนื้อหา 7 บรรทัด จะขยายสูงขึ้นอัตโนมัติ
      // เองตามเนื้อหาจริง (height เป็นค่าต่ำสุด ไม่ใช่เพดาน) ไม่ต้องบังคับให้เท่ากับแถวอื่น ──
      '<tr style="height:8mm;"><td style="border:1px solid #000;padding:4px;">1</td>'+
        '<td style="border:1px solid #000;padding:4px;text-align:left;">Plating type</td>'+
        '<td style="border:1px solid #000;padding:4px;">'+esc(ctx.platingTypeStd||'-')+'</td>'+
        '<td style="border:1px solid #000;padding:4px;">Visual check</td>'+
        sampleCellsVisual+
        '<td style="border:1px solid #000;padding:4px;">-</td><td style="border:1px solid #000;padding:4px;">-</td>'+
        '<td style="border:1px solid #000;padding:4px;font-weight:700;color:#16a34a;">OK</td>'+
      '</tr>'+
      '<tr style="height:8mm;"><td style="border:1px solid #000;padding:4px;">2</td>'+
        '<td style="border:1px solid #000;padding:4px;text-align:left;">Thickness of plating</td>'+
        '<td style="border:1px solid #000;padding:4px;">'+esc(ctx.thicknessLabel)+'</td>'+
        '<td style="border:1px solid #000;padding:4px;">Thickness Tester</td>'+
        sampleCellsThick+
        '<td style="border:1px solid #000;padding:4px;font-weight:700;">'+(ctx.xbar==null?'-':ctx.xbar)+'</td>'+
        '<td style="border:1px solid #000;padding:4px;">'+(ctx.r==null?'-':ctx.r)+'</td>'+
        '<td style="border:1px solid #000;padding:4px;font-weight:700;color:'+(ctx.thicknessResult==='OK'?'#16a34a':'#dc2626')+';">'+ctx.thicknessResult+'</td>'+
      '</tr>'+
      // ── Appearance check — แต่ละหัวข้อ (ซิ้งค์ติดทั่วทั้งตัว, สีเรียบเงา ฯลฯ) มีแถว Sample 1-5/X̄/R/Result
      // เป็นของตัวเอง แยกกันตามต้นฉบับจริง ไม่ใช่รวมเป็นแถวเดียว (พลาดไปรอบก่อน) ใช้ rowspan ให้ No./Item
      // Inspection/Measurement คร่อมทุกแถวย่อย จำนวนแถวอิงตาม ctx.appearanceItems.length จริง ไม่ตายตัวที่ 7
      // เผื่อแอดมินแก้ไขจำนวนหัวข้อในทะเบียน Standard ภายหลัง ──
      ctx.appearanceItems.map(function(item, idx){
        var n = ctx.appearanceItems.length;
        var firstCells = idx === 0
          ? '<td rowspan="'+n+'" style="border:1px solid #000;padding:4px;">3</td>'+
            '<td rowspan="'+n+'" style="border:1px solid #000;padding:4px;text-align:left;">Appearance check</td>'
          : '';
        var measureCell = idx === 0
          ? '<td rowspan="'+n+'" style="border:1px solid #000;padding:4px;">Visual check</td>'
          : '';
        return '<tr style="height:8mm;">'+firstCells+
          '<td style="border:1px solid #000;padding:4px;text-align:left;font-size:9px;">'+esc(item)+'</td>'+
          measureCell+
          sampleCellsVisual+
          '<td style="border:1px solid #000;padding:4px;">-</td><td style="border:1px solid #000;padding:4px;">-</td>'+
          '<td style="border:1px solid #000;padding:4px;font-weight:700;color:#16a34a;">OK</td>'+
        '</tr>';
      }).join('')+
      '<tr style="height:8mm;"><td style="border:1px solid #000;padding:4px;">4</td>'+
        '<td style="border:1px solid #000;padding:4px;text-align:left;">Hazardous Substance</td>'+
        '<td style="border:1px solid #000;padding:4px;">'+esc(ctx.hazardousStd||'-')+'</td>'+
        '<td style="border:1px solid #000;padding:4px;">Test Report</td>'+
        sampleCellsVisual+
        '<td style="border:1px solid #000;padding:4px;">-</td><td style="border:1px solid #000;padding:4px;">-</td>'+
        '<td style="border:1px solid #000;padding:4px;font-weight:700;color:#16a34a;">OK</td>'+

// โหมดสำรอง: ย่อกระดาษ A4 ทั้งแผ่นให้พอดีความกว้างจอ (ไม่ขยายเกิน 100%) แล้วจัดกึ่งกลางถ้าจอกว้างกว่ากระดาษ
function fitSheet() {
  var inner = document.getElementById('stageInner');
  var sheet = document.getElementById('sheet');
  if (sheet.style.display === 'none') return;
  sheet.style.transform = 'none';
  sheet.style.marginLeft = '0px';
  var natW = sheet.offsetWidth, natH = sheet.offsetHeight;
  var avail = inner.clientWidth;
  var s = Math.min(1, avail / natW);
  sheet.style.transform = 'scale(' + s + ')';
  sheet.style.marginLeft = Math.max(0, (avail - natW * s) / 2) + 'px';
  inner.style.height = Math.ceil(natH * s) + 'px';
}
window.addEventListener('resize', fitSheet);
window.addEventListener('orientationchange', fitSheet);
window.addEventListener('load', fitSheet);

function getIdFromUrl() {
  var params = new URLSearchParams(window.location.search);

function getJson(url) {
  return fetch(url).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function pdfFileName() {
  var rec = currentRecord || {};
  var base = [rec.docNo || 'ICS', rec.proLotNo || ''].filter(Boolean).join('_');
  return base.replace(/[\\\/:*?"<>|\s]+/g, '_') + '.pdf';
}

// สร้าง PDF A4 จากภาพใบที่ออกจริงบนมือถือลูกค้าเอง (ภาพถ่ายเต็มแผ่น 210x297mm จึงวางเต็มหน้าพอดี)
function downloadPdf() {
  if (!currentSnap) return;
  if (!(window.jspdf && window.jspdf.jsPDF)) {
    showMsg('ตัวสร้าง PDF ยังโหลดไม่เสร็จ — รอสักครู่แล้วกดใหม่ หรือกดปุ่ม "พิมพ์" แล้วเลือกบันทึกเป็น PDF');
    return;
  }
  try {
    var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    pdf.addImage(currentSnap, 'JPEG', 0, 0, 210, 297);
    pdf.save(pdfFileName());
    showMsg('');
  } catch (e) {
    console.warn(e);
    showMsg('สร้าง PDF ไม่สำเร็จ — ลองกดปุ่ม "พิมพ์" แล้วเลือกบันทึกเป็น PDF แทน หรือกดค้างที่รูปเพื่อบันทึกเป็นรูป');
  }
}

// ── ใบที่ป้องกันด้วยรหัสผ่าน (AES-256-GCM, กุญแจจากรหัสด้วย PBKDF2-SHA256) — ต้องตรงกับ icsEncrypt/icsDeriveKey ใน tag_card.html ──
// ข้อมูลที่เก็บบนฐานข้อมูลเป็นซองเข้ารหัส { v, enc, kdf, iter, salt, iv, ct } ไม่มีข้อความอ่านได้ ถอดรหัสบนเครื่องของท่านเท่านั้น
var PW_LS_KEY = 'apk_ics_pw';
var _lock = null;   // { id, rec, snap, src } ซองที่รอถอดรหัส
function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
// iter จำกัด 100,000–1,000,000 กันซองที่ถูกสร้างมาให้เครื่องผู้เปิดคำนวณนานผิดปกติ
function envOk(e) { return !!e && e.v === 1 && e.enc === 'AES-GCM' && e.kdf === 'PBKDF2-SHA256' && typeof e.salt === 'string' && typeof e.iv === 'string' && typeof e.ct === 'string' && isFinite(e.iter) && e.iter >= 100000 && e.iter <= 1000000; }
function decryptEnv(key, env, id) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv), additionalData: new TextEncoder().encode(id) }, key, unb64(env.ct))
    .then(function(buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function lockErr(t) { document.getElementById('pwErr').textContent = t || ''; }

// ลองถอดรหัสด้วยรหัสที่ให้มา → Promise<true|false> (false = รหัสผิดหรือข้อมูลเสีย) / reject 'nocrypto' ถ้าเบราว์เซอร์ไม่รองรับ
function tryUnlock(password) {
  var L = _lock;
  if (!(window.crypto && crypto.subtle && typeof TextEncoder !== 'undefined')) return Promise.reject(new Error('nocrypto'));
  if (!envOk(L.src)) return Promise.resolve(false);
  return crypto.subtle.importKey('raw', new TextEncoder().encode(String(password).normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
    .then(function(base) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(L.src.salt), iterations: L.src.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
    .then(function(key) {
      var recP = (L.rec && envOk(L.rec)) ? decryptEnv(key, L.rec, L.id) : Promise.resolve(null);
      // ภาพถอดไม่ได้ไม่ถือว่ารหัสผิด (ถอยไปแสดงจากข้อมูลแทน) แต่ถ้าไม่มีทั้งข้อมูลและภาพที่ถอดได้ = ไม่สำเร็จ
      var snapP = (L.snap && envOk(L.snap)) ? decryptEnv(key, L.snap, L.id).catch(function() { return null; }) : Promise.resolve(null);
      return Promise.all([recP, snapP]);
    })
    .then(function(r) {
      if (!r[0] && !(r[1] && r[1].img)) return false;
      showUnlocked(r[0], r[1]);
      return true;
    })
    .catch(function(e) { if (e && e.message === 'nocrypto') throw e; return false; });
}
function showUnlocked(rec, snap) {
  currentRecord = rec || null;
  document.getElementById('lockBox').style.display = 'none';
  document.getElementById('stateArea').style.display = 'none';
  document.getElementById('topSub').textContent = 'APK Plating Service Co.,Ltd. — ใบนี้ป้องกันด้วยรหัสผ่าน';
  document.getElementById('pwInput').value = '';
  if (snap && snap.img) showImageMode(snap.img); else if (rec) showHtmlMode(rec);
}
function setPwBusy(b) {
  document.getElementById('pwBtn').disabled = b;
  document.getElementById('pwBtn').textContent = b ? 'กำลังตรวจรหัสผ่าน…' : 'เปิดดูใบตรวจสอบ';
}
function submitPw() {
  var pw = document.getElementById('pwInput').value;
  if (!pw) { lockErr('กรอกรหัสผ่านก่อน'); return; }
  lockErr(''); setPwBusy(true);
  tryUnlock(pw).then(function(ok) {
    setPwBusy(false);
    if (ok) { lsSet(PW_LS_KEY, document.getElementById('pwRemember').checked ? pw : null); return; }
    lockErr('รหัสไม่ถูกต้อง หรือคุณไม่มีสิทธิ์เข้าถึงไฟล์ข้อมูลนี้ — ตรวจรหัสของบริษัทท่านแล้วลองใหม่');
    var el = document.getElementById('pwInput'); el.focus(); el.select();
  }).catch(function() {
    setPwBusy(false);
    lockErr('เบราว์เซอร์นี้ถอดรหัสไม่ได้ — เปิดด้วย Chrome, Edge หรือ Safari รุ่นล่าสุด ผ่านที่อยู่ที่ขึ้นต้นด้วย https');
  });
}
function startLock(id, rec, snap, src) {
  _lock = { id: id, rec: rec, snap: snap, src: src };
  document.getElementById('topSub').textContent = 'APK Plating Service Co.,Ltd. — ใบนี้ป้องกันด้วยรหัสผ่าน';
  var box = document.getElementById('lockBox'), st = document.getElementById('stateArea');
  var saved = lsGet(PW_LS_KEY);
  document.getElementById('pwForget').style.display = saved ? 'inline' : 'none';
  document.getElementById('pwRemember').checked = !!saved;
  function showForm(msg) { st.style.display = 'none'; box.style.display = 'block'; lockErr(msg || ''); if (!msg) document.getElementById('pwInput').focus(); }
  if (!saved) { showForm(''); return; }
  // มีรหัสที่จำไว้ในเครื่องนี้: ลองเปิดให้เองก่อน โดยยังไม่โชว์ช่องกรอก (ไม่ให้ฟอร์มวูบขึ้นมาแล้วหาย) — ไม่ผ่าน (เช่น เป็นใบของลูกค้าคนละราย) ค่อยโชว์ให้กรอกเอง
  st.className = 'state-box'; st.style.display = 'block'; st.textContent = '🔓 กำลังเปิดใบด้วยรหัสที่จำไว้ในเครื่องนี้…';
  tryUnlock(saved).then(function(ok) {
    if (!ok) showForm('รหัสที่จำไว้ในเครื่องนี้เปิดใบนี้ไม่ได้ (รหัสผิด หรือไม่มีสิทธิ์เข้าถึงไฟล์ข้อมูลนี้) — กรอกรหัสของบริษัทท่าน');
  }).catch(function() { showForm('เบราว์เซอร์นี้ถอดรหัสไม่ได้ — เปิดด้วย Chrome, Edge หรือ Safari รุ่นล่าสุด ผ่านที่อยู่ที่ขึ้นต้นด้วย https'); });
}
(function wireLock() {
  document.getElementById('pwBtn').addEventListener('click', submitPw);
  document.getElementById('pwInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); submitPw(); } });
  document.getElementById('pwEye').addEventListener('click', function() { var i = document.getElementById('pwInput'); i.type = (i.type === 'password') ? 'text' : 'password'; });
  document.getElementById('pwForget').addEventListener('click', function() {
    lsSet(PW_LS_KEY, null); document.getElementById('pwForget').style.display = 'none'; document.getElementById('pwRemember').checked = false; lockErr('ลืมรหัสที่จำไว้แล้ว');
  });
})();

function loadRecord() {
  var id = getIdFromUrl();
  // กันคนเผลอแปะ URL เพี้ยน — เช็คความยาวคร่าวๆ ก่อนยิง fetch (ไม่ใช่มาตรการความปลอดภัยจริงจัง แค่กัน fetch เปล่าประโยชน์)
  if (!id || id.length < 10) { showError('ลิงก์ไม่ถูกต้อง — ไม่พบรหัสใบตรวจสอบ'); return; }
  var enc = encodeURIComponent(id);
  // undefined = โหลดไม่สำเร็จ (เน็ต/เซิร์ฟเวอร์) ต่างจาก null = โหลดได้แต่ไม่มีข้อมูล
  var recP  = getJson(ICS_RECORDS_URL + '/' + enc + '.json').catch(function(){ return undefined; });
  var snapP = getJson(ICS_SNAPS_URL   + '/' + enc + '.json').catch(function(){ return undefined; });
  Promise.all([recP, snapP]).then(function(r){
    var rec = r[0], snap = r[1];
    // ใบที่เข้ารหัส: ยังไม่แสดงอะไรจนกว่าจะกรอกรหัสถูก (ไม่ใช้ข้อมูล/ภาพแบบไม่เข้ารหัสที่ปะปนมา)
    var encSrc = (rec && rec.enc) ? rec : ((snap && snap.enc) ? snap : null);
    if (encSrc) { startLock(id, (rec && rec.enc) ? rec : null, (snap && snap.enc) ? snap : null, encSrc); return; }
    currentRecord = rec || null;
    if (snap && snap.img) {
      document.getElementById('stateArea').style.display = 'none';
      showImageMode(snap.img);
    } else if (rec) {
      document.getElementById('stateArea').style.display = 'none';
      showHtmlMode(rec);
    } else if (rec === undefined || snap === undefined) {
      showError('โหลดข้อมูลไม่สำเร็จ — ลองรีเฟรชหน้าใหม่อีกครั้ง');
    } else {
      showError('ไม่พบใบตรวจสอบนี้ — อาจเป็นลิงก์เก่าหรือพิมพ์ผิด');
    }
  });
}
loadRecord();
