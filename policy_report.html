<style>
:root{
  --navy:#0f2044; --navy-2:#16305e; --blue2:#3b82f6;
  --steel-1:#cbd5e1; --steel-2:#94a3b8; --steel-3:#f8fafc;
  --bg:#eef2f7; --card:#fff; --border:#e2e8f0;
  --text:#0f172a; --text-mid:#475569; --text-muted:#94a3b8;
  --green:#16a34a; --red:#dc2626; --amber:#d97706;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'IBM Plex Sans Thai',sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
.mono{font-family:'IBM Plex Mono',monospace;}

header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
header h1{font-size:15px; font-weight:700;}
header p{font-size:10.5px; color:#b9c4de;}
.back-link{font-size:11px; color:#b9c4de; text-decoration:none;}
.hdr-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

#loginScreen{position:fixed; inset:0; background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.login-box{background:#fff; border-radius:16px; padding:32px 28px; width:100%; max-width:340px; text-align:center;}
.login-box h1{font-size:16px; font-weight:700; color:var(--navy); margin-bottom:2px;}
.login-box p{font-size:11.5px; color:var(--text-mid); margin-bottom:20px;}
.login-box input{width:100%; text-align:center; letter-spacing:6px; font-size:20px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px;}
.login-err{color:var(--red); font-size:11.5px; margin-top:10px; min-height:14px;}

.btn{border:none; border-radius:9px; padding:9px 16px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-ghost{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-light{background:#fff; color:var(--navy); border:1px solid var(--steel-1);}
.btn-light:hover{background:var(--steel-3);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
select.yearsel{padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; font-family:inherit; font-size:12.5px;}
select.yearsel option{color:#000;}

main{max-width:1300px; margin:0 auto; padding:20px 16px 60px;}
.loading{text-align:center; color:var(--text-muted); padding:60px 20px; font-size:13px;}

.sheet{background:#fff; border:1px solid var(--border); border-radius:4px; padding:22px; font-size:11.5px;}
.sheet-head{display:grid; grid-template-columns:120px 1fr 200px; gap:14px; align-items:center; border-bottom:2px solid var(--navy); padding-bottom:14px; margin-bottom:14px;}
.sheet-head img{width:100%; max-width:100px;}
.sheet-head .titleblock{text-align:center;}
.sheet-head .titleblock h2{font-size:22px; font-weight:800; letter-spacing:2px; color:var(--navy);}
.sheet-head .titleblock .yearline{font-size:12px; color:var(--text-mid); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:6px;}
.sigbox{border:1px solid var(--border); font-size:9.5px;}
.sigbox table{width:100%; border-collapse:collapse;}
.sigbox th, .sigbox td{border:1px solid var(--border); padding:4px 6px; text-align:center;}
.sigbox th{background:var(--steel-3); font-weight:700;}
.sigbox input{width:100%; border:none; text-align:center; font-family:inherit; font-size:10.5px; padding:2px;}

.metabar{display:grid; grid-template-columns:80px 90px 1fr 1fr; gap:10px; margin-bottom:14px; font-size:11px;}
.metabar .mb{border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.metabar .mb .lbl{background:var(--navy); color:#fff; font-weight:700; padding:5px 8px; font-size:9.5px;}
.metabar .mb .val{padding:6px 8px;}
.metabar .mb .val input{width:100%; border:none; font-family:inherit; font-size:11px; background:transparent;}

.polgrid{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--border); margin-bottom:14px;}
.polgrid .cell{padding:8px 10px; border-right:1px solid var(--border);}
.polgrid .cell:last-child{border-right:none;}
.polgrid .cell h4{font-size:10px; text-align:center; font-weight:700; color:var(--navy); background:var(--steel-3); margin:-8px -10px 8px; padding:6px; border-bottom:1px solid var(--border);}
.polgrid textarea{width:100%; border:none; font-family:inherit; font-size:11px; resize:vertical; min-height:44px; background:transparent;}

.ganttwrap{border:1px solid var(--border); margin-bottom:14px; overflow-x:auto;}
table.gantt{width:100%; border-collapse:collapse; font-size:10.5px; min-width:760px;}
table.gantt th{background:var(--navy); color:#fff; padding:5px 4px; text-align:center; font-weight:700; font-size:9.5px;}
table.gantt td{border:1px solid var(--border); padding:3px 4px; text-align:center;}
table.gantt td.tasklabel{text-align:left; font-size:10.5px; min-width:220px;}
table.gantt td.tasklabel textarea{width:100%; border:none; font-family:inherit; font-size:10.5px; resize:none; background:transparent;}
table.gantt .rowno{width:22px; color:var(--text-muted);}
table.gantt select.sf-select{width:100%; border:1px solid var(--border); border-radius:5px; font-family:inherit; font-size:10px; padding:2px;}
.ganttbar-track{position:relative; height:18px; border-radius:3px; background-image:repeating-linear-gradient(to right, var(--border), var(--border) 1px, transparent 1px, transparent calc(100%/12));}
.ganttbar-fill{position:absolute; top:2px; bottom:2px; background:var(--navy); border-radius:3px;}
.ach-cell{display:flex; align-items:center; justify-content:center; gap:5px;}
.ach-cell input{width:42px; border:1px solid var(--border); border-radius:5px; font-family:inherit; font-size:10.5px; text-align:right; padding:2px 3px;}
.ach-circle{width:16px; height:16px; border-radius:50%; flex-shrink:0; border:1px solid var(--steel-2);}
table.gantt .delbtn{cursor:pointer; font-size:13px;}
.gantt-actions{padding:6px 8px; display:flex; justify-content:flex-end; gap:6px; background:var(--steel-3);}

.chart-card{border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:14px;}
.chart-card .chartwrap{position:relative; height:290px;}
.legend-note{font-size:9.5px; color:var(--text-muted); text-align:center; margin-top:4px;}

.datawrap{overflow-x:auto; margin-bottom:14px;}
table.datatbl{width:100%; border-collapse:collapse; font-size:10.5px; min-width:900px;}
table.datatbl th{background:var(--navy); color:#fff; padding:5px 4px; text-align:center; font-weight:700; font-size:9.5px;}
table.datatbl td{border:1px solid var(--border); padding:5px 4px; text-align:center;}
table.datatbl td.rowlabel{text-align:left; font-weight:700; background:var(--steel-3); min-width:150px;}
table.datatbl td.totalcol{font-weight:700; background:#fef9c3;}
table.datatbl .synced{color:var(--blue2); font-weight:700;}
table.datatbl .manual{color:var(--text-mid);}
table.datatbl .empty-cell{color:var(--steel-2);}

.notewrap{overflow-x:auto;}
.histgrid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.histrow{display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:11px;}
.histrow .histyear{font-weight:700; color:var(--navy); min-width:36px;}
.histrow .histval{width:64px; border:1px solid var(--border); border-radius:5px; padding:3px 5px; font-family:inherit; font-size:11px;}
.histrow #newHistYear{border:1px solid var(--border); border-radius:5px; padding:5px 8px; font-family:inherit; font-size:11px;}
input.histcell{width:100%; border:none; text-align:center; font-family:inherit; font-size:10.5px; background:transparent;}
table.notetbl{width:100%; border-collapse:collapse; font-size:10.5px; min-width:700px;}
table.notetbl th{background:var(--navy); color:#fff; padding:5px 4px; font-size:9.5px;}
table.notetbl td{border:1px solid var(--border); padding:4px 6px; vertical-align:top;}
table.notetbl textarea{width:100%; border:none; font-family:inherit; font-size:10.5px; resize:vertical; min-height:30px; background:transparent;}
table.notetbl .monthcell{font-weight:700; white-space:nowrap; background:var(--steel-3);}

.sheet-foot{display:flex; justify-content:space-between; font-size:9.5px; color:var(--text-muted); margin-top:10px; border-top:1px solid var(--border); padding-top:8px;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 20px; border-radius:9px; font-size:12.5px; z-index:80; opacity:0; transition:opacity .2s; pointer-events:none;}
.toast.show{opacity:1;}

.synclog{font-size:9.5px; color:var(--text-muted); margin-top:6px;}

@media print{
  body{background:#fff;}
  header, .noprint{display:none !important;}
  main{max-width:none; padding:0;}
  .sheet{border:none; padding:0;}
  @page{ size: A4 landscape; margin:10mm; }
}

<script>
// ══════════════════════════════════════════════════════
//  เช็คเวอร์ชันใหม่ — เทียบกับ version.json บน GitHub เป็นระยะ
//  ถ้าไม่ตรงกับเวอร์ชันล่าสุดที่เครื่องนี้เคยเห็น แสดงว่ามีการอัปเดตไฟล์ใหม่ขึ้นไปแล้ว
//  ขึ้นแถบแจ้งเตือนให้กดรีเฟรชเอง แก้ปัญหา "ไม่รู้ตัวว่ากำลังดูเวอร์ชันเก่าอยู่"
//  (โดยเฉพาะเคสไอคอน iOS Add to Home Screen ที่ไม่เช็คอัปเดตเองเลย)
//
//  เปลี่ยนวิธีจากเดิม (เทียบกับเลขที่ฝังไว้ในตัวไฟล์ตรงๆ) เป็นเก็บ "เวอร์ชันล่าสุดที่เครื่องนี้เคยเห็น" ไว้ใน
//  localStorage แทน — ข้อดีคือ "ทุกครั้งที่แก้ version.json ไม่ต้องไล่แก้เลขในทุกไฟล์ .html ให้ตรงกันอีกต่อไป"
//  แค่แก้ version.json ไฟล์เดียวพอ ทุกหน้าจะเทียบกับค่าที่เก็บไว้ในเครื่องแทน และเมื่อหน้าไหนหน้าหนึ่งถูกกด
//  รีเฟรชแล้ว หน้าอื่นๆ ที่เปิดค้างอยู่บนเครื่องเดียวกัน (localStorage ใช้ร่วมกันทั้ง origin) ก็จะรู้ตัวว่า
//  อัปเดตแล้วไปด้วยในการเช็ครอบถัดไป ไม่ต้องกดรีเฟรชทีละแท็บ
// ══════════════════════════════════════════════════════
(function(){
  var LS_KEY = 'apk_seen_version';
  function checkVersion(){
    fetch('version.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (!data || !data.version) return;
        var seen = null;
        try { seen = localStorage.getItem(LS_KEY); } catch(e){}
        if (seen === null) {
          // ครั้งแรกที่เครื่องนี้เห็นระบบ — บันทึกไว้เฉยๆ ไม่ต้องเตือน (ไม่มีเวอร์ชันเก่าให้เทียบ)
          try { localStorage.setItem(LS_KEY, data.version); } catch(e){}
          return;
        }
        if (seen !== data.version) showVersionBanner(data.version);
      })
      .catch(function(){}); // เงียบไว้ถ้าเช็คไม่ได้ (ออฟไลน์ ฯลฯ) ไม่รบกวนการใช้งาน
  }
  function showVersionBanner(newVersion){
    if (document.getElementById('versionUpdateBanner')) return;
    var b = document.createElement('div');
    b.id = 'versionUpdateBanner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#f59e0b;color:#000;text-align:center;padding:10px 14px;font-size:13px;font-weight:700;font-family:sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);';
    b.textContent = '🔄 มีเวอร์ชันใหม่กว่านี้ — แตะเพื่อโหลดหน้าใหม่';
    b.onclick = function(){
      try { localStorage.setItem(LS_KEY, newVersion); } catch(e){}
      location.href = location.pathname + '?v=' + Date.now();
    };
    document.body.appendChild(b);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkVersion);
  } else {
    checkVersion();
  }
  setInterval(checkVersion, 5*60*1000); // เช็คซ้ำทุก 5 นาที
})();
</script>
<script>
// ══════════════════════════════════════════════════════
//  ล้าง Service Worker เก่าที่เคยติดตั้งไว้ (จากฟีเจอร์ PWA ที่ยกเลิกไปแล้ว) ออกจากทุกเครื่องอัตโนมัติ
//  เจอปัญหาจริง: SW ที่ตั้งใจให้ "ไม่แคชอะไรเลย" กลับไปดักจับ fetch ของทุกหน้าในโฟลเดอร์เดียวกัน (ไม่ใช่แค่
//  index.html ที่ตั้งใจไว้) แล้วทำให้ response บางคำขอ (เช่น apk_hr.html ดึง attendance.json) กลายเป็น 0 ไบต์
//  แทนที่จะเป็นข้อมูลจริง — ลบออกให้ทุกเครื่องที่เคยติดตั้งไว้ โดยไม่ต้องไปกด Unregister เองทีละเครื่อง
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  }).catch(function(){});
}
if ('caches' in window) {
  caches.keys().then(function(names){
    names.forEach(function(name){ caches.delete(name); });
  }).catch(function(){});
}
</script>

<script>
'use strict';

var SYSTEM_KEY = 'kpi';
var DB_URL = 'https://platingapp-92e21-c1346-default-rtdb.asia-southeast1.firebasedatabase.app';
var PATHS = {
  metrics: DB_URL + '/kpi/metrics',
  entries: DB_URL + '/kpi/entries',
  report:  DB_URL + '/kpi/policyReport'
};
var FB = {
  B1: 'https://platingapp-92e21-c1346-default-rtdb.asia-southeast1.firebasedatabase.app',
  B2: 'https://platingapp-b2-default-rtdb.asia-southeast1.firebasedatabase.app',
  R1: 'https://platingapp-r1-default-rtdb.asia-southeast1.firebasedatabase.app'
};
var DAY_PATHS = { B1:'/plating-b1.json', B2:'/plating-b2.json', R1:'/plating-r1.json' };

var MONTH_NAMES = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var DEFAULT_HIST = {
  2018:{target:10, prod:360.00, ng:55.15},
  2019:{target:10, prod:450.00, ng:45.00},
  2020:{target:8,  prod:520.00, ng:32.00},
  2021:{target:6,  prod:580.00, ng:25.00},
  2022:{target:6,  prod:735.00, ng:35.00},
  2023:{target:5,  prod:680.00, ng:30.00},
  2024:{target:5,  prod:743.00, ng:32.00}
};
/* รองรับข้อมูลเก่าที่เคยบันทึกเป็นตัวเลข % เดี่ยว ให้แปลงเป็นโครงสร้างใหม่ {target,prod,ng} */
function normalizeHistYear(v, year){
  if (v != null && typeof v === 'object') return {target: v.target==null?null:Number(v.target), prod: v.prod==null?null:Number(v.prod), ng: v.ng==null?null:Number(v.ng)};
  // รูปแบบเก่า (แค่ตัวเลข % เดียว) — ถ้าเป็นปีที่เรามีข้อมูลจริงครบ (target/prod/ng) อยู่แล้ว ให้อัปเกรดให้อัตโนมัติ
  if (year != null && DEFAULT_HIST[year]) return Object.assign({}, DEFAULT_HIST[year]);
  return {target: null, prod: null, ng: null, ratioOverride: v==null?null:Number(v)};
}
function histRatio(h){
  if (h.prod != null && h.prod > 0 && h.ng != null) return (h.ng/h.prod)*100;
  if (h.ratioOverride != null) return h.ratioOverride;
  return null;
}
var DEFAULT_TASKS = [
  {label:'กำหนดความถี่ของสุ่มตรวจสอบเรื่องความหนาทุกๆ 1 ชม.', start:1, finish:1, ach:100},
  {label:'กำหนดความถี่ของการวิเคราะห์ความเข้มข้นของเคมีทุกๆ 4 ชม.', start:1, finish:1, ach:100},
  {label:'สร้างจิตสำนึกของพนักงานผลิตเรื่อง ไม่รับ-ไม่ทำ-ไม่ส่งของเสียไปยังกระบวนการถัดไป', start:1, finish:12, ach:50}
];
/* รองรับข้อมูลเก่าที่เคยบันทึกเป็นแบบ checkbox รายเดือน (months[]) ให้แปลงเป็น start/finish/ach% อัตโนมัติ */
function normalizeTask(t){
  if (t && t.months && Array.isArray(t.months)){
    var idxs = t.months.map(function(v,i){ return v?i+1:null; }).filter(function(v){ return v!=null; });
    var start = idxs.length ? idxs[0] : 1;
    var finish = idxs.length ? idxs[idxs.length-1] : 12;
    var ach = t.ach==='full' ? 100 : (t.ach==='partial' ? 50 : 0);
    return {label:t.label||'', start:start, finish:finish, ach:ach};
  }
  return {label:t.label||'', start:t.start||1, finish:t.finish||12, ach:Number(t.ach)||0};
}

/* ══════════════ init: หา metric ══════════════ */
function init(){
  metricId = qs('metric');
  fbGet(PATHS.metrics).then(function(all){
    all = all || {};
    if (metricId && all[metricId]) {
      metric = all[metricId];
    } else {
      // fallback: หาแบบ PR + ratio + ชื่อมีคำว่า "ของเสีย"
      var found = Object.keys(all).filter(function(id){
        var m = all[id];
        return m.dept === 'PR' && m.type === 'ratio' && (m.name||'').indexOf('ของเสีย') !== -1;
      })[0];
      if (found) { metricId = found; metric = all[found]; }
    }
    if (!metric) {
      $('sheetArea').innerHTML = '<div class="loading">ไม่พบตัวชี้วัดสำหรับรายงานนี้ — กรุณาเปิดผ่านปุ่ม "📋 ฟอร์ม Policy Action Plan" จากหน้าแดชบอร์ด KPI (แผนก PR)</div>';
      return;
    }
    $('hdrMetricName').textContent = metric.name + ' · แผนก ' + (metric.dept||'-');
    buildYearSelect();
    loadReportAndRender();
  });
}
function buildYearSelect(){
  var now = new Date().getFullYear();
  var opts = [];
  for (var y = now+1; y >= now-8; y--) opts.push('<option value="'+y+'"'+(y===selectedYear?' selected':'')+'>'+y+'</option>');
  $('yearSelect').innerHTML = opts.join('');
  $('yearSelect').addEventListener('change', function(){ selectedYear = parseInt(this.value,10); loadReportAndRender(); });
}

function loadReportAndRender(){
  $('sheetArea').innerHTML = '<div class="loading">กำลังโหลดข้อมูล…</div>';
  Promise.all([ fbGet(PATHS.report + '/' + metricId), fbGet(PATHS.entries), loadLiveProduction(selectedYear) ]).then(function(res){
    report = res[0] || {};
    entries = res[1] || {};
    if (!report.tasks || !report.tasks.length) report.tasks = DEFAULT_TASKS.map(function(t){ return Object.assign({}, t); });
    else report.tasks = report.tasks.map(normalizeTask);
    if (!report.historicalYears) report.historicalYears = Object.assign({}, DEFAULT_HIST);
    else {
      var normalized = {}; var upgraded = false;
      Object.keys(report.historicalYears).forEach(function(y){
        var orig = report.historicalYears[y];
        var isLegacyFlat = !(orig != null && typeof orig === 'object');
        normalized[y] = normalizeHistYear(orig, y);
        if (isLegacyFlat && normalized[y].prod != null) upgraded = true; // อัปเกรดจาก % เดียวเป็นชุดข้อมูลเต็มสำเร็จ
      });
      report.historicalYears = normalized;
      if (upgraded) fbPut(PATHS.report + '/' + metricId + '/historicalYears', report.historicalYears);
    }
    if (!report.policyText) report.policyText = 'ควบคุมคุณภาพชิ้นงานจากกระบวนการชุบ';
    if (!report.planText) report.planText = 'ทบทวนความถี่ของการสุ่มตรวจสอบคุณภาพ';
    if (!report.policyItemNo) report.policyItemNo = '1';
    if (!report.signatures) report.signatures = {approve:'พิพิธ', review:'พิพิธ', prepare:'พิพิธ'};
    if (!report.notes) report.notes = {};
    if (!report.targets) report.targets = {};
    if (!report.targets[selectedYear]) report.targets[selectedYear] = {h1: metric.target, h2: metric.target};
    renderSheet();
  });
}
/* ดึงข้อมูลการผลิตจริงจาก B1/B2/R1 แบบสดทุกครั้งที่เปิดหน้า/เปลี่ยนปี — ไม่ต้องกดปุ่มรีเฟรช */
/* R1 บันทึก totalKg/reworkKg ระดับวันเป็นหน่วย "ชิ้น" (บั๊กที่ต้นทาง v6) แต่ rows รายบ่อนั้นมี kg ที่แปลงจาก Part Master ถูกต้องอยู่แล้ว
   ฟังก์ชันนี้จึงคำนวณ kg จริงของ R1 จาก rows แทนที่จะเชื่อ totalKg/reworkKg ระดับวันตรง ๆ — ไม่ต้องแก้ไฟล์ plating_v6_R1.html เลย
   B1/B2 ใช้ totalKg/reworkKg ระดับวันตามปกติ เพราะถูกต้องอยู่แล้ว */
function dayTotals(line, day){
  if (line === 'R1'){
    var rows = Array.isArray(day.rows) ? day.rows : [];
    if (rows.length){
      var prod=0, ng=0;
      rows.forEach(function(r){
        var kg = Number(r.kg||0);
        prod += kg;
        if (r.type !== 'N') ng += kg;
      });
      return { prodKg: prod, ngKg: ng };
    }
    // ไม่มี rows เก็บไว้ (ข้อมูลเก่ามาก) — fallback ใช้ค่าระดับวัน (จะเป็นหน่วยชิ้นที่เพี้ยน แต่ดีกว่าไม่มีข้อมูลเลย)
    return { prodKg: Number(day.totalKg||0), ngKg: Number(day.reworkKg||0) };
  }
  return { prodKg: Number(day.totalKg||0), ngKg: Number(day.reworkKg||0) };
}

function loadLiveProduction(year){
  var lines = ['B1','B2','R1'];
  return Promise.all(lines.map(fetchLineData)).then(function(results){
    var byMonth = {}; for (var mi=1; mi<=12; mi++) byMonth[pad2(mi)] = {prodKg:0, ngKg:0};
    results.forEach(function(data, idx){
      var line = lines[idx];
      var recs = Array.isArray(data.dayRecords) ? data.dayRecords : [];
      recs.forEach(function(day){
        if (!day || !day.date || day.date.slice(0,4) !== String(year)) return;
        var mm = day.date.slice(5,7);
        if (!byMonth[mm]) return;
        var t = dayTotals(line, day);
        byMonth[mm].prodKg += t.prodKg;
        byMonth[mm].ngKg += t.ngKg;
      });
    });
    liveProd[year] = byMonth;
    lastLiveFetch = new Date();
    return byMonth;
  });
}

/* ══════════════ คำนวณข้อมูลรายเดือน — ใช้ข้อมูลสดจากสายผลิตก่อน ถ้าไม่มีค่อย fallback เป็นค่าที่กรอกมือ ══════════════ */
function monthKey(y,m){ return y+'-'+pad2(m); }
function monthEntry(y,m){ return (entries[monthKey(y,m)] || {})[metricId]; }
function targetForMonth(y,m){
  var t = (report.targets && report.targets[y]) || {h1:metric.target, h2:metric.target};
  return m <= 6 ? Number(t.h1) : Number(t.h2);
}
function monthCalc(y,m){
  var lp = liveProd[y];
  if (lp){
    var b = lp[pad2(m)];
    if (b && b.prodKg > 0){
      return { prodT: b.prodKg/1000, ngT: b.ngKg/1000, ratio: (b.ngKg/b.prodKg)*100, source:'live' };
    }
  }
  var e = monthEntry(y,m);
  if (!e || e.numerator == null || e.denominator == null || Number(e.denominator) === 0) return null;
  var ngT = Number(e.numerator), prodT = Number(e.denominator);
  return { prodT: prodT, ngT: ngT, ratio: (ngT/prodT)*100, source:'manual' };
}
function yearAvgRatio(y){
  var sumN=0, sumD=0, any=false;
  for (var m=1;m<=12;m++){ var c = monthCalc(y,m); if (c){ sumN+=c.ngT; sumD+=c.prodT; any=true; } }
  return any && sumD>0 ? (sumN/sumD)*100 : null;
}

/* ══════════════ Gantt ══════════════ */
function monthOptions(selected){
  var out = '';
  for (var mi=1; mi<=12; mi++) out += '<option value="'+mi+'"'+(mi===selected?' selected':'')+'>'+MONTH_NAMES[mi-1]+'</option>';
  return out;
}
function ganttHtml(){
  var rows = report.tasks.map(function(t,i){
    var start = t.start||1, finish = t.finish||12;
    var leftPct = ((start-1)/12)*100;
    var widthPct = ((finish-start+1)/12)*100;
    var ach = Number(t.ach)||0;
    return '<tr>' +
      '<td class="rowno">'+(i+1)+'</td>' +
      '<td class="tasklabel"><textarea rows="1" data-task-label="'+i+'" '+(canEdit()?'':'disabled')+'>'+escapeHtml(t.label)+'</textarea></td>' +
      '<td><select class="sf-select" data-task-start="'+i+'" '+(canEdit()?'':'disabled')+'>'+monthOptions(start)+'</select></td>' +
      '<td><select class="sf-select" data-task-finish="'+i+'" '+(canEdit()?'':'disabled')+'>'+monthOptions(finish)+'</select></td>' +
      '<td colspan="12" style="padding:3px 4px;"><div class="ganttbar-track"><div class="ganttbar-fill" style="left:'+leftPct+'%; width:'+widthPct+'%;"></div></div></td>' +
      '<td><div class="ach-cell"><input type="number" min="0" max="100" step="5" data-task-ach="'+i+'" value="'+ach+'" '+(canEdit()?'':'disabled')+'>%' +
        '<div class="ach-circle" data-ach-circle="'+i+'" style="background:conic-gradient(var(--navy) '+ach+'%, #e2e8f0 0);"></div></div></td>' +
      (canEdit()?'<td><span class="delbtn" data-task-del="'+i+'" title="ลบแถวนี้">🗑️</span></td>':'') +

  }).join('');

      '</tbody>' +
    '</table></div>' +
    addNewYear +
  '</div>';
}

/* ══════════════ ตารางข้อมูลรายเดือน ══════════════ */
function dataTableHtml(){
  var yTargets = report.targets[selectedYear] || {h1:metric.target, h2:metric.target};
  var rowsData = [];
  var totalProd=0, totalNg=0, anyData=false;
  for (var m=1;m<=12;m++){
    var c = monthCalc(selectedYear, m);
    if (c){ totalProd+=c.prodT; totalNg+=c.ngT; anyData=true; }
    rowsData.push({c:c, m:m, tgt: targetForMonth(selectedYear, m)});
  }
  var totalRatio = anyData && totalProd>0 ? (totalNg/totalProd)*100 : null;

  function rowCells(getter){
    return rowsData.map(getter).join('') + '<td class="totalcol">'+getter({c: anyData?{prodT:totalProd, ngT:totalNg, ratio:totalRatio}:null, m:null, tgt:null})+'</td>';
  }
  var targetRow = rowCells(function(r){ return '<td>'+(r.tgt==null?(yTargets.h1+'% / '+yTargets.h2+'%'):r.tgt+'%')+'</td>'; });
  var prodRow = rowCells(function(r){ return '<td>'+(r.c ? '<span class="'+(r.c.source==='live'?'synced':'manual')+'">'+round2(r.c.prodT)+(r.c.source==='live'?' 🔗':'')+'</span>' : '<span class="empty-cell">—</span>')+'</td>'; });
  var ngRow = rowCells(function(r){ return '<td>'+(r.c ? '<span class="'+(r.c.source==='live'?'synced':'manual')+'">'+round2(r.c.ngT)+'</span>' : '<span class="empty-cell">—</span>')+'</td>'; });
  var ratioRow = rowCells(function(r){
    if (!r.c) return '<td><span class="empty-cell">—</span></td>';
    var tgt = r.tgt==null ? yTargets.h2 : r.tgt;
    var ok = r.c.ratio <= tgt;
    return '<td><span style="color:'+(ok?'var(--green)':'var(--red)')+'; font-weight:700;">'+round2(r.c.ratio)+'%</span></td>';
  });
  var selfRow = rowCells(function(r){
    if (!r.c) return '<td><span class="empty-cell">—</span></td>';
    var tgt = r.tgt==null ? yTargets.h2 : r.tgt;
    return '<td>'+(r.c.ratio <= tgt ? '😊' : '☹️')+'</td>';
  });

  var headCells = MONTH_NAMES.map(function(mn){ return '<th>'+mn+'</th>'; }).join('') + '<th>Total</th>';

  return '<div class="datawrap"><table class="datatbl">' +
    '<thead><tr><th style="text-align:left;">รายการ</th>'+headCells+'</tr></thead>' +
    '<tbody>' +
      '<tr><td class="rowlabel">Target %</td>'+targetRow+'</tr>' +
      '<tr><td class="rowlabel">'+escapeHtml(metric.denomLabel||'ปริมาณการชุบ (Tons)')+'</td>'+prodRow+'</tr>' +
      '<tr><td class="rowlabel">'+escapeHtml(metric.numLabel||'ปริมาณงาน NG (Tons)')+'</td>'+ngRow+'</tr>' +
      '<tr><td class="rowlabel">NG Ratio (%)</td>'+ratioRow+'</tr>' +
      '<tr><td class="rowlabel">Self Evaluation</td>'+selfRow+'</tr>' +
    '</tbody></table></div>';
}

/* ══════════════ ตาราง ปัญหา/หมายเหตุรายเดือน — แสดงเฉพาะเดือนที่มีการเพิ่มไว้ ══════════════ */
function noteTableHtml(){
  var monthsInYear = [];
  for (var m=1;m<=12;m++) monthsInYear.push(monthKey(selectedYear,m));
  var existing = monthsInYear.filter(function(mk){ return !!report.notes[mk]; });

  var rows = existing.map(function(mk){
    var n = report.notes[mk] || {};
    var mi = parseInt(mk.split('-')[1],10);
    return '<tr>' +
      '<td class="monthcell">'+MONTH_NAMES[mi-1]+' '+selectedYear+(canEdit()?' <span class="delbtn" data-note-del="'+mk+'" title="ลบรายการนี้">🗑️</span>':'')+'</td>' +
      '<td><textarea data-note-field="summary" data-note-month="'+mk+'" '+(canEdit()?'':'disabled')+'>'+escapeHtml(n.summary||'')+'</textarea></td>' +
      '<td><textarea data-note-field="problem" data-note-month="'+mk+'" '+(canEdit()?'':'disabled')+'>'+escapeHtml(n.problem||'')+'</textarea></td>' +
      '<td><input type="text" data-note-field="checkedBy" data-note-month="'+mk+'" value="'+escapeHtml(n.checkedBy||'')+'" '+(canEdit()?'':'disabled')+'></td>' +
    '</tr>';
  });
  var emptyRow = !rows.length ? '<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding:14px;">ยังไม่มีบันทึกปัญหาในปีนี้</td></tr>' : '';
  var availMonths = monthsInYear.filter(function(mk){ return !report.notes[mk]; });
  var addControl = canEdit() && availMonths.length ? '<div class="gantt-actions"><select id="newNoteMonth">' +
      availMonths.map(function(mk){ var mi=parseInt(mk.split('-')[1],10); return '<option value="'+mk+'">'+MONTH_NAMES[mi-1]+' '+selectedYear+'</option>'; }).join('') +
    '</select><button class="btn btn-light btn-sm" id="addNoteBtn">+ เพิ่มรายการปัญหา</button></div>' : '';
  var save = canEdit() && rows.length ? '<div class="gantt-actions"><button class="btn btn-light btn-sm" id="saveNotesBtn">บันทึกตารางปัญหา/หมายเหตุ</button></div>' : '';
  return '<div class="notewrap"><table class="notetbl">' +
    '<thead><tr><th style="width:130px;">Month</th><th>Summary Of Problem</th><th>Problem &amp; Activity to be Solved Following Month</th><th style="width:100px;">Checked By (QMR)</th></tr></thead>' +
    '<tbody>'+(rows.join('')||emptyRow)+'</tbody></table>'+addControl+save+'</div>';
}

/* ══════════════ กราฟ ══════════════ */
function drawChart(prevYearRatio){
  var histYears = Object.keys(report.historicalYears).sort();
  var labels = histYears.concat(MONTH_NAMES);
  var yTargets = report.targets[selectedYear] || {h1:metric.target, h2:metric.target};

  var prodBars = histYears.map(function(y){ var h=report.historicalYears[y]||{}; return h.prod==null?null:round2(h.prod); });
  var ngBars = histYears.map(function(y){ var h=report.historicalYears[y]||{}; return h.ng==null?null:round2(h.ng); });
  var ratioLine = histYears.map(function(y){ var h=report.historicalYears[y]||{}; var r=histRatio(h); return r==null?null:round2(r); });
  var targetLine = histYears.map(function(y){ var h=report.historicalYears[y]||{}; return h.target==null?yTargets.h1:h.target; });

  for (var m=1;m<=12;m++){
    var c = monthCalc(selectedYear, m);
    prodBars.push(c ? round2(c.prodT) : null);
    ngBars.push(c ? round2(c.ngT) : null);
    ratioLine.push(c ? round2(c.ratio) : null);
    targetLine.push(targetForMonth(selectedYear, m));
  }

  if (chartRef) chartRef.destroy();
  var ctx = document.getElementById('mainChart').getContext('2d');
  chartRef = new Chart(ctx, {
    data:{
      labels: labels,
      datasets:[
        {type:'bar', label: metric.denomLabel||'ปริมาณการชุบ (Ton)', data:prodBars, backgroundColor:'#16a34a', yAxisID:'y', order:3},
        {type:'bar', label: metric.numLabel||'ปริมาณงาน NG (Ton)', data:ngBars, backgroundColor:'#dc2626', yAxisID:'y', order:2},
        {type:'line', label:'Target % (ปรับทุก 6 เดือน)', data:targetLine, borderColor:'#dc2626', borderDash:[4,3], pointRadius:0, yAxisID:'y1', order:0, tension:0, stepped:true},
        {type:'line', label:'Result NG Ratio (%)', data:ratioLine, borderColor:'#1d4ed8', backgroundColor:'#1d4ed8', pointRadius:3, yAxisID:'y1', order:1, tension:.25}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      scales:{
        y:{ position:'left', title:{display:true,text:'Ton'}, beginAtZero:true },
        y1:{ position:'right', title:{display:true,text:'%'}, beginAtZero:true, max:20, grid:{drawOnChartArea:false} }
      },
      plugins:{ legend:{position:'bottom', labels:{boxWidth:12, font:{size:10}}} }
    }
  });
}

/* ══════════════ ผูก events ══════════════ */
function wireSheetEvents(){
  if (!isAdmin()) { document.querySelectorAll('#sigApprove,#sigReview,#sigPrepare').forEach(function(el){ el.disabled = true; }); }

  document.querySelectorAll('#fYear,#fItemNo,#fTargetMark,#fPolicy,#fPlan,#fTargetH1,#fTargetH2').forEach(function(el){
    if (el.disabled) return;
    el.addEventListener('change', saveMetaFields);
  });
  ['sigApprove','sigReview','sigPrepare'].forEach(function(id){
    var el = $(id); if (el && !el.disabled) el.addEventListener('change', saveMetaFields);
  });

  document.querySelectorAll('[data-task-start]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var ti = parseInt(sel.getAttribute('data-task-start'),10);
      report.tasks[ti].start = parseInt(sel.value,10);
      if (report.tasks[ti].start > report.tasks[ti].finish) report.tasks[ti].finish = report.tasks[ti].start;
      renderSheet();
    });
  });
  document.querySelectorAll('[data-task-finish]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var ti = parseInt(sel.getAttribute('data-task-finish'),10);
      report.tasks[ti].finish = parseInt(sel.value,10);
      if (report.tasks[ti].finish < report.tasks[ti].start) report.tasks[ti].start = report.tasks[ti].finish;
      renderSheet();
    });
  });
  document.querySelectorAll('[data-task-ach]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var ti = parseInt(inp.getAttribute('data-task-ach'),10);
      var v = Math.max(0, Math.min(100, Number(inp.value)||0));
      report.tasks[ti].ach = v;
      var circle = document.querySelector('[data-ach-circle="'+ti+'"]');
      if (circle) circle.style.background = 'conic-gradient(var(--navy) '+v+'%, #e2e8f0 0)';
    });
  });
  document.querySelectorAll('[data-task-del]').forEach(function(el){
    el.addEventListener('click', function(){
      var ti = parseInt(el.getAttribute('data-task-del'),10);
      if (!confirm('ลบแถวนี้?')) return;
      report.tasks.splice(ti,1);
      renderSheet();
    });
  });
  document.querySelectorAll('[data-task-label]').forEach(function(el){
    el.addEventListener('change', function(){
      var ti = parseInt(el.getAttribute('data-task-label'),10);
      report.tasks[ti].label = el.value;
    });
  });
  if ($('addTaskBtn')) $('addTaskBtn').addEventListener('click', function(){
    report.tasks.push({label:'', start:1, finish:1, ach:0});
    renderSheet();
  });
  if ($('saveGanttBtn')) $('saveGanttBtn').addEventListener('click', function(){
    fbPut(PATHS.report + '/' + metricId + '/tasks', report.tasks).then(function(){ toast('บันทึกตารางกิจกรรมแล้ว'); });
  });

  document.querySelectorAll('[data-note-field]').forEach(function(el){
    el.addEventListener('change', function(){
      var mk = el.getAttribute('data-note-month'), f = el.getAttribute('data-note-field');
      report.notes[mk] = report.notes[mk] || {};
      report.notes[mk][f] = el.value;
    });
  });
  document.querySelectorAll('[data-note-del]').forEach(function(el){
    el.addEventListener('click', function(){
      var mk = el.getAttribute('data-note-del');
      if (!confirm('ลบรายการปัญหาของเดือนนี้?')) return;
      delete report.notes[mk];
      fbPut(PATHS.report + '/' + metricId + '/notes', report.notes).then(function(){ toast('ลบแล้ว'); renderSheet(); });
    });
  });
  if ($('addNoteBtn')) $('addNoteBtn').addEventListener('click', function(){
    var mk = $('newNoteMonth').value;
    report.notes[mk] = {summary:'', problem:'', checkedBy:''};
    renderSheet();
  });
  if ($('saveNotesBtn')) $('saveNotesBtn').addEventListener('click', function(){
    fbPut(PATHS.report + '/' + metricId + '/notes', report.notes).then(function(){ toast('บันทึกตารางปัญหา/หมายเหตุแล้ว'); });
  });

  if ($('toggleHistBtn')) $('toggleHistBtn').addEventListener('click', function(){
    histPanelOpen = !histPanelOpen;
    renderSheet();
  });
  document.querySelectorAll('[data-hist-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var y = inp.getAttribute('data-hist-year'), f = inp.getAttribute('data-hist-field');
      report.historicalYears[y] = report.historicalYears[y] || {target:null, prod:null, ng:null};
      report.historicalYears[y][f] = inp.value === '' ? null : Number(inp.value);
      renderSheet();
    });
  });
  document.querySelectorAll('[data-hist-del]').forEach(function(el){
    el.addEventListener('click', function(){
      var y = el.getAttribute('data-hist-del');
      if (!confirm('ลบปี '+y+' ออกจากประวัติย้อนหลัง?')) return;
      delete report.historicalYears[y];
      fbPut(PATHS.report + '/' + metricId + '/historicalYears', report.historicalYears).then(function(){ toast('ลบแล้ว'); renderSheet(); });
    });
  });
  document.querySelectorAll('[data-hist-auto]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var y = parseInt(btn.getAttribute('data-hist-auto'),10);
      var origText = btn.textContent; btn.disabled = true; btn.textContent = '⏳';
      loadLiveProduction(y).then(function(){
        var lp = liveProd[y]; var sumProd=0, sumNg=0, any=false;
        Object.keys(lp||{}).forEach(function(mm){ if (lp[mm].prodKg>0){ sumProd+=lp[mm].prodKg; sumNg+=lp[mm].ngKg; any=true; } });
        if (!any){ toast('ไม่พบข้อมูลการผลิตของปี '+y+' ในระบบ B1/B2/R1'); btn.disabled=false; btn.textContent=origText; return; }
        report.historicalYears[String(y)] = report.historicalYears[String(y)] || {target:null,prod:null,ng:null};
        report.historicalYears[String(y)].prod = round2(sumProd/1000);
        report.historicalYears[String(y)].ng = round2(sumNg/1000);
        toast('ดึงข้อมูลปี '+y+' สำเร็จ');
        renderSheet();
      });
    });
  });
  if ($('addHistYearBtn')) $('addHistYearBtn').addEventListener('click', function(){
    var y = $('newHistYear').value;
    if (!y){ toast('กรุณากรอกปี'); return; }
    if (report.historicalYears[y] !== undefined){ toast('มีปีนี้อยู่แล้ว'); return; }
    report.historicalYears[y] = {target:null, prod:null, ng:null};
    renderSheet();
  });
  if ($('saveHistBtn')) $('saveHistBtn').addEventListener('click', function(){
    fbPut(PATHS.report + '/' + metricId + '/historicalYears', report.historicalYears).then(function(){ toast('บันทึกประวัติย้อนหลังแล้ว'); });
  });
}
function saveMetaFields(){
  report.policyItemNo = $('fItemNo') ? $('fItemNo').value : report.policyItemNo;
  report.targetMarkText = $('fTargetMark') ? $('fTargetMark').value : report.targetMarkText;
  report.policyText = $('fPolicy') ? $('fPolicy').value : report.policyText;
  report.planText = $('fPlan') ? $('fPlan').value : report.planText;
  report.signatures = {
    approve: $('sigApprove') ? $('sigApprove').value : report.signatures.approve,
    review:  $('sigReview')  ? $('sigReview').value  : report.signatures.review,
    prepare: $('sigPrepare') ? $('sigPrepare').value : report.signatures.prepare
  };
  if (!report.targets) report.targets = {};
  report.targets[selectedYear] = {
    h1: $('fTargetH1') ? (Number($('fTargetH1').value)||0) : (report.targets[selectedYear]||{}).h1,
    h2: $('fTargetH2') ? (Number($('fTargetH2').value)||0) : (report.targets[selectedYear]||{}).h2
  };
  fbPut(PATHS.report + '/' + metricId, {
    policyItemNo: report.policyItemNo, targetMarkText: report.targetMarkText,
    policyText: report.policyText, planText: report.planText,
    signatures: report.signatures, tasks: report.tasks,
    historicalYears: report.historicalYears, notes: report.notes, targets: report.targets
  }).then(function(){ toast('บันทึกแล้ว'); renderSheet(); });
}

/* ══════════════ ดึงข้อมูลอัตโนมัติจากสายผลิต B1/B2/R1 ══════════════ */
function fetchLineData(line){
  return fetch(FB[line] + DAY_PATHS[line]).then(function(r){ return r.ok ? r.json() : {dayRecords:[]}; }).catch(function(){ return {dayRecords:[]}; });
}
function syncFromProduction(){
  var btn = $('syncBtn'); btn.disabled = true; btn.textContent = '⏳ กำลังดึงข้อมูล…';
  var lines = ['B1','B2','R1'];
  Promise.all(lines.map(fetchLineData)).then(function(results){
    var byMonth = {}; // 'MM' -> {prodKg, ngKg}
    for (var mi=1; mi<=12; mi++) byMonth[pad2(mi)] = {prodKg:0, ngKg:0};
    results.forEach(function(data, idx){
      var line = lines[idx];
      var recs = Array.isArray(data.dayRecords) ? data.dayRecords : [];
      recs.forEach(function(day){
        if (!day || !day.date) return;
        if (day.date.slice(0,4) !== String(selectedYear)) return;
        var mm = day.date.slice(5,7);
        if (!byMonth[mm]) return;
        var t = dayTotals(line, day);
        byMonth[mm].prodKg += t.prodKg;
        byMonth[mm].ngKg += t.ngKg;
      });
    });
    var patchByMonth = {};
    var monthsWithData = 0;
    Object.keys(byMonth).forEach(function(mm){
      var b = byMonth[mm];
      if (b.prodKg <= 0) return;
      monthsWithData++;
      var mk = selectedYear + '-' + mm;
      patchByMonth[mk] = {};
      patchByMonth[mk][metricId] = {
        numerator: round2(b.ngKg/1000), denominator: round2(b.prodKg/1000),
        note: (entries[mk] && entries[mk][metricId] && entries[mk][metricId].note) || '',
        source: 'auto-sync',
        enteredBy: {pin: session.pin, name: session.user.name},
        enteredAt: new Date().toISOString()
      };
    });
    if (!monthsWithData){
      toast('ไม่พบข้อมูลการผลิตของปี ' + selectedYear + ' ในระบบ B1/B2/R1');
      btn.disabled = false; btn.textContent = '💾 บันทึกสำเนาเข้า KPI Entries';
      return;
    }
    var chain = Promise.resolve();
    Object.keys(patchByMonth).forEach(function(mk){
      chain = chain.then(function(){ return fbPatch(PATHS.entries + '/' + mk, patchByMonth[mk]); });
    });
    chain.then(function(){
      toast('ดึงและบันทึกข้อมูล ' + monthsWithData + ' เดือนจากสายผลิตสำเร็จ');
      loadReportAndRender();
    }).finally(function(){ btn.disabled = false; btn.textContent = '💾 บันทึกสำเนาเข้า KPI Entries'; });
  });
}
