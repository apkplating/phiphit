name: Auto Production Order Scheduler

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-auto-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auto scheduler
        run: node scripts/auto-schedule.js
