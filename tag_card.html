<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tag Card — APK Plating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f2744; --navy-mid:#1a3a5c; --blue:#2e75b6; --blue-light:#5ba3d9;
  --sky-pale:#eaf4fb; --border:rgba(46,117,182,0.18);
  --text:#0f2744; --text-mid:#2c4a6e; --text-muted:#6b8cae;
  --red:#dc2626; --green:#065f46; --amber:#b45309;
}
*{box-sizing:border-box;}
html,body{min-height:100%;background:var(--navy);font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;margin:0;color:var(--text);}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.login-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;}
.login-box h1{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.login-box p{font-size:11.5px;color:var(--text-mid);margin-bottom:20px;}
.login-box input{width:100%;text-align:center;letter-spacing:6px;font-size:20px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;box-sizing:border-box;}
.login-box .btn-primary{width:100%;padding:11px;}
.login-err{color:var(--red);font-size:11.5px;margin-top:10px;min-height:14px;}
.app-header{background:var(--navy);padding:20px 20px 16px;}
.hdr-badge{font-size:10px;font-weight:600;color:var(--blue-light);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;}
.hdr-title{font-size:19px;font-weight:800;color:#fff;}
.who-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-muted);}
.who-row a{color:var(--blue-light);text-decoration:none;}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 60px;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(15,39,68,.08);}
.card-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.10em;text-transform:uppercase;margin-bottom:10px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-mid);margin-bottom:4px;}
.field input,.field select{width:100%;padding:10px 12px;font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;color:var(--text);background:var(--sky-pale);border:1px solid var(--border);border-radius:10px;outline:none;}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,117,182,.12);background:#fff;}
.field input[readonly]{color:var(--text-mid);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.grid2{grid-template-columns:1fr;}}
.btn{padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--blue);color:var(--blue);}
.btn-sm{width:auto;padding:7px 12px;font-size:11px;border-radius:8px;}
.hint{font-size:10.5px;color:var(--text-muted);margin-top:4px;min-height:13px;}
.hint.ok{color:var(--green);} .hint.err{color:var(--red);} .hint.warn{color:var(--amber);}
.photo-row{display:flex;gap:12px;align-items:center;}
.photo-box{width:72px;height:56px;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--sky-pale);}
.photo-box img{width:100%;height:100%;object-fit:contain;}
.photo-box .ph-empty{font-size:9px;color:var(--text-muted);text-align:center;}
.toast{margin-top:8px;font-size:12px;font-weight:700;padding:8px 10px;border-radius:8px;display:none;}
.toast.ok{background:#ecfdf5;color:var(--green);display:block;}
.toast.err{background:#fef2f2;color:var(--red);display:block;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>🏷️ Tag Card</h1>
    <p>APK Plating — ใบกำกับผลิตภัณฑ์ — ใส่ PIN เพื่อเข้าใช้งาน</p>
    <input type="password" id="loginPin" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn btn-primary" id="loginBtn">เข้าสู่ระบบ</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app" style="display:none;">
<div class="app-header">
  <div class="hdr-badge">APK PLATING</div>
  <div class="hdr-title">🏷️ Tag Card — ใบกำกับผลิตภัณฑ์</div>
  <div class="who-row">
    <a href="index.html">← หน้าแรก</a>
    <span><b id="whoName">—</b> · <span id="whoRole">—</span></span>
    <button class="btn-logout" id="logoutBtn">ออกจากระบบ</button>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <div class="card-label">✏️ กรอกข้อมูล Tag</div>

    <div class="field">
      <label>Cust. Name (ชื่อลูกค้า)</label>
      <input type="text" id="tgCust" placeholder="ชื่อลูกค้า">
    </div>

    <div class="grid2">
      <div class="field" style="margin-bottom:0;">
        <label>P/No. (จาก Part Master)</label>
        <input type="text" id="tgPartNo" list="tgPartNoList" placeholder="พิมพ์/เลือก P/No" oninput="onPartNoInput()" onblur="onPartNoBlur()">
        <datalist id="tgPartNoList"></datalist>
        <div class="hint" id="tgPartHint"></div>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>P/Name (จาก Part Master)</label>
        <input type="text" id="tgPartName" readonly placeholder="เลือก P/No ก่อน">
      </div>
    </div>

    <div class="field" style="margin-top:12px;">
      <label>รูปชิ้นงาน (ไม่บังคับ)</label>
      <div class="photo-row">
        <div class="photo-box" id="tgPhotoBox"><div class="ph-empty">ไม่มีรูป</div></div>
        <div style="flex:1;">
          <input type="file" id="tgPhotoFile" accept="image/*" onchange="onPhotoPicked()" style="font-size:11px;">
          <div class="hint" id="tgPhotoHint">เลือกรูปแล้วระบบจะย่อขนาดให้อัตโนมัติก่อนบันทึก</div>
        </div>
      </div>
    </div>

    <div class="grid2" style="margin-top:12px;">
      <div class="field" style="margin-bottom:0;">
        <label>Pro Lot No.</label>
        <input type="text" id="tgLot" placeholder="เลข Lot การผลิต" oninput="scheduleInspLookup()">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Del. Date</label>
        <input type="date" id="tgDelDate">
      </div>
    </div>

    <div class="field" style="margin-top:12px;">
      <label>Insp. By (ดึงจาก QC 100% อัตโนมัติ — แก้เองได้ถ้าไม่เจอ)</label>
      <input type="text" id="tgInspBy" placeholder="ชื่อผู้ตรวจสอบ">
      <div class="hint" id="tgInspHint"></div>
    </div>

    <div class="grid2" style="margin-top:12px;">
      <div class="field" style="margin-bottom:0;">
        <label>Q'TY (จำนวน)</label>
        <input type="number" id="tgQty" min="0" placeholder="0">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>หน่วย</label>
        <input type="text" id="tgUnit" value="pcs/Box">
      </div>
    </div>

    <div class="field" style="margin-top:12px;">
      <label>จำนวน Tag ที่จะพิมพ์ (ใบ)</label>
      <input type="number" id="tgCount" min="1" value="1">
    </div>

    <button class="btn btn-primary" onclick="printTags()" style="margin-top:6px;">🖨️ พิมพ์ Tag (ประทับ QC PASS อัตโนมัติ)</button>
    <div id="toast" class="toast"></div>
  </div>

</div>
</div>

<script src="auth-central.js"></script>
<script src="fb-auth.js"></script>
<script>
// ═══════════════════════════════════════════════
//  Tag Card — ใบกำกับผลิตภัณฑ์ (แทนการ copy กระดาษต้นฉบับ + ประทับตรา QC PASS ด้วยมือ)
//  อ้างอิงข้อมูล 2 แหล่งแบบอ่านอย่างเดียว ไม่แก้ไขต้นทาง:
//    - Part Master (part-master.json)  -> ชื่อชิ้นงานจาก P/No
//    - qc100.html (plating-{line}-qc100.json) -> ชื่อผู้ตรวจสอบ จับคู่ด้วย P/No + Lot No
//  รูปชิ้นงานเก็บแยกไฟล์ต่างหาก (part-photos.json) โดยเจตนา — กันไม่ให้ part-master.json (ที่ v4/v5/v6
//  ต้องโหลดทุกครั้งที่พิมพ์ค้นหา P/No ตอนกรอกรายรอบ) ใหญ่ขึ้นจนช้าลงทั้งระบบ เฉพาะไฟล์นี้เท่านั้นที่โหลด
// ═══════════════════════════════════════════════

var SYSTEM_KEY = 'tagcard';
var session = null;

var FB_LINES = {
  B1: 'https://platingapp-92e21-c1346-default-rtdb.asia-southeast1.firebasedatabase.app',
  B2: 'https://platingapp-b2-default-rtdb.asia-southeast1.firebasedatabase.app',
  R1: 'https://platingapp-r1-default-rtdb.asia-southeast1.firebasedatabase.app'
};
var PM_URL    = FB_LINES.B1 + '/part-master.json';
var PHOTO_URL = FB_LINES.B1 + '/part-photos.json'; // ไฟล์แยกต่างหาก ไม่ปนกับ part-master.json โดยเจตนา

var partList = [];        // [{partNo, partName}]
var partPhotos = {};      // { [partNo]: 'data:image/jpeg;base64,...' }
var _selectedPhotoB64 = null; // รูปที่เพิ่งเลือกแต่ยังไม่บันทึก (บันทึกจริงตอนกดพิมพ์)
var _inspLookupTimer = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function showToast(msg, kind){ var t=$('toast'); t.className='toast '+(kind||'ok'); t.textContent=msg; setTimeout(function(){ t.className='toast'; }, 3000); }

// ── Login (เหมือนไฟล์อื่นในระบบทุกจุด) ──
function loadSession(){ try{ var r=sessionStorage.getItem('tagcard_session'); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveSession(s){ sessionStorage.setItem('tagcard_session', JSON.stringify(s)); }
function clearSession(){ sessionStorage.removeItem('tagcard_session'); }
function doLogin(pin){
  $('loginErr').textContent = '';
  CentralAuth.login(pin, SYSTEM_KEY).then(function(result){
    if (!result.ok) {
      var msg = {invalid_pin:'PIN ไม่ถูกต้อง', no_access:'PIN นี้ไม่มีสิทธิ์ใช้ระบบนี้', connection_error:'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'}[result.reason] || 'เข้าสู่ระบบไม่สำเร็จ';
      $('loginErr').textContent = msg;
      return;
    }
    session = result; saveSession(result); enterApp();
  });
}
function enterApp(){
  $('loginScreen').style.display = 'none';
  $('app').style.display = 'block';
  $('whoName').textContent = session.user.name || session.pin;
  $('whoRole').textContent = {admin:'ผู้ดูแลระบบ', operator:'เจ้าหน้าที่', viewer:'ผู้ดูเท่านั้น'}[session.role] || session.role;
  $('tgDelDate').value = isoToday();
  loadPartList();
  loadPartPhotos();
}
function isoToday(){ return new Date().toISOString().split('T')[0]; }

// ══════════════════════════════════════
//  PART MASTER — อ่านอย่างเดียว
// ══════════════════════════════════════
function loadPartList() {
  fetch(PM_URL).then(function(r){ return r.ok ? r.json() : null; }).then(function(data){
    if (data && Array.isArray(data.parts)) {
      partList = data.parts.map(function(p){ return { partNo:p.partNo||'', partName:p.name||p.partName||'' }; });
      $('tgPartNoList').innerHTML = partList.map(function(p){ return '<option value="'+esc(p.partNo)+'">'; }).join('');
    }
  }).catch(function(e){ console.warn('Part Master load:', e.message); });
}
function onPartNoInput() {
  $('tgPartName').value = '';
  $('tgPartHint').textContent = ''; $('tgPartHint').className = 'hint';
  renderPhotoBox(null);
}
function onPartNoBlur() {
  var val = $('tgPartNo').value.trim();
  if (!val) return;
  var match = partList.find(function(p){ return p.partNo.toLowerCase() === val.toLowerCase(); });
  if (match) {
    $('tgPartNo').value = match.partNo;
    $('tgPartName').value = match.partName || '';
    $('tgPartHint').textContent = '✅ เจอใน Part Master';
    $('tgPartHint').className = 'hint ok';
    renderPhotoBox(match.partNo);
  } else {
    $('tgPartHint').textContent = '⚠️ ไม่เจอ P/No นี้ใน Part Master — ยังพิมพ์ได้ แต่ต้องกรอกชื่อชิ้นงานเอง';
    $('tgPartHint').className = 'hint warn';
    $('tgPartName').removeAttribute('readonly');
    renderPhotoBox(null);
  }
  scheduleInspLookup();
}

// ══════════════════════════════════════
//  รูปชิ้นงาน — เก็บแยกไฟล์ part-photos.json (อ่าน/เขียนเฉพาะไฟล์นี้ ไม่แตะ part-master.json)
// ══════════════════════════════════════
function loadPartPhotos() {
  fetch(PHOTO_URL).then(function(r){ return r.ok ? r.json() : null; }).then(function(data){
    partPhotos = (data && typeof data==='object') ? data : {};
  }).catch(function(e){ console.warn('Part photos load:', e.message); });
}
function renderPhotoBox(partNo) {
  _selectedPhotoB64 = null;
  $('tgPhotoFile').value = '';
  var box = $('tgPhotoBox');
  var existing = partNo ? partPhotos[partNo] : null;
  box.innerHTML = existing ? '<img src="'+existing+'">' : '<div class="ph-empty">ไม่มีรูป</div>';
  $('tgPhotoHint').textContent = existing ? 'มีรูปอยู่แล้ว — เลือกไฟล์ใหม่เพื่อแทนที่' : 'เลือกรูปแล้วระบบจะย่อขนาดให้อัตโนมัติก่อนบันทึก';
}
// ย่อรูปเหลือกว้างไม่เกิน 240px คุณภาพ JPEG 0.6 ก่อนเก็บ — ไฟล์เล็กมาก (ไม่กี่ KB ต่อรูป) ปลอดภัยแม้มีชิ้นงานเป็นร้อยแบบ
function onPhotoPicked() {
  var file = $('tgPhotoFile').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxW = 240;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      _selectedPhotoB64 = canvas.toDataURL('image/jpeg', 0.6);
      $('tgPhotoBox').innerHTML = '<img src="'+_selectedPhotoB64+'">';
      $('tgPhotoHint').textContent = 'พร้อมบันทึก (จะบันทึกตอนกดพิมพ์ Tag)';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function savePhotoIfNeeded(partNo) {
  if (!_selectedPhotoB64 || !partNo) return Promise.resolve();
  partPhotos[partNo] = _selectedPhotoB64;
  return fetch(PHOTO_URL, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(partPhotos)
  }).catch(function(e){ console.warn('Part photo save:', e.message); });
}

// ══════════════════════════════════════
//  QC 100% — ค้นหาผู้ตรวจสอบ จับคู่ P/No + Lot No (อ่านจากทั้ง B1/B2/R1)
// ══════════════════════════════════════
function scheduleInspLookup() {
  clearTimeout(_inspLookupTimer);
  _inspLookupTimer = setTimeout(lookupInspector, 500); // รอพิมพ์นิ่งก่อนค่อยค้นหา กันยิง fetch รัวๆ
}
function lookupInspector() {
  var partNo = $('tgPartNo').value.trim();
  var lot = $('tgLot').value.trim();
  if (!partNo || !lot) { $('tgInspHint').textContent = ''; return; }
  $('tgInspHint').textContent = '⏳ กำลังค้นหาใน QC 100%...';
  $('tgInspHint').className = 'hint';

  var lines = ['B1','B2','R1'];
  Promise.all(lines.map(function(line){
    return fetch(FB_LINES[line] + '/plating-'+line.toLowerCase()+'-qc100.json')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ return (d && Array.isArray(d.records)) ? d.records : []; })
      .catch(function(){ return []; });
  })).then(function(results){
    var all = [].concat.apply([], results);
    var matches = all.filter(function(r){
      return r && String(r.partNo||'').trim().toLowerCase() === partNo.toLowerCase()
              && String(r.lotNo||'').trim().toLowerCase() === lot.toLowerCase();
    }).sort(function(a,b){ return (b.ts||0) - (a.ts||0); }); // ใหม่สุดก่อน
    if (matches.length) {
      $('tgInspBy').value = matches[0].inspector || '';
      $('tgInspHint').textContent = '✅ เจอในระบบ QC 100% ('+matches[0].line+', '+matches[0].date+')';
      $('tgInspHint').className = 'hint ok';
    } else {
      $('tgInspHint').textContent = '⚠️ ไม่เจอ P/No+Lot นี้ใน QC 100% — กรอกชื่อผู้ตรวจสอบเอง';
      $('tgInspHint').className = 'hint warn';
    }
  });
}

// ══════════════════════════════════════
//  พิมพ์ Tag — 6 ใบต่อหน้า A4 (2 คอลัมน์ x 3 แถว) ประทับ QC PASS อัตโนมัติทุกใบ
// ══════════════════════════════════════
function buildStampSvg(dateStr) {
  // สไตล์เดียวกับตราประทับใน Document Control (stamp_gui.py): กรอบสี่เหลี่ยมขอบหนาสีน้ำเงิน ตัวหนังสือหนากึ่งกลาง
  return '<div style="border:4px solid #0033AA;border-radius:4px;padding:4px 10px;display:inline-block;text-align:center;color:#0033AA;font-weight:800;line-height:1.25;transform:rotate(-4deg);">'+
    '<div style="font-size:15px;letter-spacing:1px;">QC PASS</div>'+
    '<div style="font-size:9px;font-weight:700;">'+esc(dateStr)+'</div>'+
    '</div>';
}
function buildTagHtml(d) {
  var photoHtml = d.photo ? '<img src="'+d.photo+'" style="width:100%;height:100%;object-fit:contain;">' : '';
  function row(label, value) {
    return '<tr><td style="border:1px solid #000;padding:2px 6px;font-weight:700;white-space:nowrap;width:32%;">'+esc(label)+'</td>'+
      '<td style="border:1px solid #000;padding:2px 6px;">'+esc(value)+'</td></tr>';
  }
  return '<div style="border:1.5px solid #000;padding:8px;display:flex;flex-direction:column;height:100%;font-size:11px;">'+
    '<div style="text-align:center;font-weight:800;font-size:13px;margin-bottom:4px;">ใบกำกับผลิตภัณฑ์</div>'+
    '<div style="display:flex;gap:8px;flex:1;">'+
      '<table style="border-collapse:collapse;flex:1;font-size:10.5px;">'+
        row('Cust. Name', d.cust)+
        row('P/No.', d.partNo)+
        row('P/Name', d.partName)+
        row('Pro Lot No.', d.lot)+
        row('Del. Date', d.delDate)+
        row('Insp. By', d.inspBy)+
        row("Q'TY", d.qty+' '+d.unit)+
      '</table>'+
      '<div style="width:64px;height:64px;border:1px solid #999;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;">'+photoHtml+'</div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;">'+
      '<div style="font-weight:700;font-size:11px;">คัด100%</div>'+
      buildStampSvg(fmtDateTH(isoToday()))+
    '</div>'+
  '</div>';
}
function fmtDateTH(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

function printTags() {
  var d = {
    cust: $('tgCust').value.trim(),
    partNo: $('tgPartNo').value.trim(),
    partName: $('tgPartName').value.trim(),
    lot: $('tgLot').value.trim(),
    delDate: $('tgDelDate').value ? fmtDateTH($('tgDelDate').value) : '',
    inspBy: $('tgInspBy').value.trim(),
    qty: $('tgQty').value || '0',
    unit: $('tgUnit').value.trim() || 'pcs',
    photo: (partPhotos[$('tgPartNo').value.trim()] || _selectedPhotoB64 || '')
  };
  if (!d.partNo) { showToast('⚠️ กรุณากรอก P/No', 'err'); return; }
  if (!d.cust) { showToast('⚠️ กรุณากรอกชื่อลูกค้า', 'err'); return; }
  var count = parseInt($('tgCount').value, 10) || 1;
  if (count < 1) count = 1;

  savePhotoIfNeeded(d.partNo);

  var oneTag = buildTagHtml(d);
  var cells = [];
  for (var i = 0; i < count; i++) cells.push('<div style="width:48%;height:31%;margin-bottom:2%;">'+oneTag+'</div>');
  // จัดกลุ่มทีละ 6 ใบต่อหน้า (2 คอลัมน์ x 3 แถว) ขึ้นหน้าใหม่อัตโนมัติถ้าเกิน
  var pages = [];
  for (var i = 0; i < cells.length; i += 6) pages.push(cells.slice(i, i+6));
  var pagesHtml = pages.map(function(pageCells){
    return '<div style="width:100%;height:100vh;page-break-after:always;display:flex;flex-wrap:wrap;justify-content:space-between;align-content:flex-start;padding:8mm;">'+
      pageCells.join('') + '</div>';
  }).join('');

  var html = '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>ใบกำกับผลิตภัณฑ์</title>'+
    '<style>@page{size:A4;margin:0;} body{margin:0;font-family:"IBM Plex Sans Thai",sans-serif;}</style>'+
    '</head><body>'+pagesHtml+'</body></html>';

  var win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(function(){ win.print(); }, 300);

  showToast('✅ ส่งไปพิมพ์แล้ว ('+count+' ใบ)', 'ok');
}

document.addEventListener('DOMContentLoaded', function() {
  $('loginBtn').addEventListener('click', function(){ doLogin($('loginPin').value); });
  $('loginPin').addEventListener('keydown', function(e){ if (e.key==='Enter') doLogin($('loginPin').value); });
  $('logoutBtn').addEventListener('click', function(){ clearSession(); location.reload(); });
  session = loadSession();
  if (session) { enterApp(); }
});
</script>
